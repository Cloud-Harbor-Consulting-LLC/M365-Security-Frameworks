name: CI

# Runs on every push and on pull requests into main. Nothing here touches a tenant: the harnesses
# mock Microsoft Graph, and the other jobs read only the repository.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell tests and static analysis
    # The harnesses follow the Windows path conventions of the scripts they test.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Regression harnesses
        shell: pwsh
        run: ./Tests/Invoke-Tests.ps1

      - name: Static analysis gate
        shell: pwsh
        run: ./Tests/Invoke-ScriptAnalysis.ps1

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JSON, links and documented invariants
        shell: pwsh
        run: ./Tests/Test-Repository.ps1

  markdown:
    name: Markdown lint (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only Markdown files changed against main are linted. The repository carried 105 findings when
      # this gate was introduced; linting everything would block every change until all were fixed.
      # Linting what a change touches clears that debt file by file.
      - name: Lint Markdown changed against main
        shell: bash
        run: |
          base="$(git merge-base origin/main HEAD)"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Markdown files changed against main."
            exit 0
          fi
          printf 'Linting %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          npx --yes markdownlint-cli@0.48.0 --config .markdownlint.json "${files[@]}"
